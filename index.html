<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#09090b" />
  <title>星域司导 · 手机司机端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #09090b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
      color: #e4e4e7;
      overflow-x: hidden;
    }
    .container {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
      background: radial-gradient(ellipse at top, #0f172a 0%, #09090b 60%);
    }
    .logo {
      width: 100px; height: 100px;
      border-radius: 24px;
      box-shadow: 0 0 40px rgba(16,185,129,0.2);
      margin-bottom: 20px;
      object-fit: cover;
    }
    .title {
      font-size: 26px; font-weight: 700;
      letter-spacing: 0.5em;
      color: #10b981;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px; color: #71717a;
      margin-bottom: 36px;
    }
    .info-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 24px;
    }
    .info-row {
      display: flex; justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid #27272a;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #71717a; }
    .info-value { color: #e4e4e7; font-weight: 500; }
    .download-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-size: 18px; font-weight: 600;
      padding: 16px 48px;
      border-radius: 14px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(16,185,129,0.3);
      margin-bottom: 16px;
    }
    .download-btn:active { transform: scale(0.96); }
    .hint {
      font-size: 12px; color: #52525b;
      margin-top: 8px;
    }
    .qr-section {
      margin-top: 32px;
    }
    .qr-label {
      font-size: 12px; color: #52525b;
      margin-bottom: 12px;
    }
    #qrcode {
      display: inline-block;
      background: #fff;
      padding: 12px;
      border-radius: 12px;
    }
    .footer {
      margin-top: 40px;
      font-size: 11px; color: #3f3f46;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="/app-icon.jpg" alt="星域司导" />
    <div class="title">星域司导</div>
    <div class="subtitle">手机司机端 · Android</div>

    <div class="info-card">
      <div class="info-row">
        <span class="info-label">版本</span>
        <span class="info-value" id="version">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">构建</span>
        <span class="info-value" id="versionCode">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">大小</span>
        <span class="info-value" id="size">-</span>
      </div>
    </div>

    <a class="download-btn" id="downloadBtn" href="#" onclick="downloadAPK()">
      📥 下载 Android APK
    </a>
    <span class="hint">点击下载安装包，或扫描二维码</span>

    <div class="qr-section">
      <div class="qr-label">📱 手机扫码下载</div>
      <div id="qrcode"></div>
    </div>

    <div class="footer">© 2026 星域司导 · Stellarelite</div>
  </div>

  <script>
    async function init() {
      try {
        const resp = await fetch('/version.json');
        const data = await resp.json();
        document.getElementById('version').textContent = data.versionName || '-';
        document.getElementById('versionCode').textContent = 'Build ' + (data.versionCode || '-');
        document.getElementById('downloadBtn').href = data.apkUrl || '/xyzl-driver.apk';
      } catch(e) {
        document.getElementById('downloadBtn').href = '/xyzl-driver.apk';
      }

      const sizeEl = document.getElementById('size');
      try {
        const resp = await fetch('/xyzl-driver.apk', { method: 'HEAD' });
        const cl = resp.headers.get('content-length');
        if (cl) {
          sizeEl.textContent = (cl / 1024 / 1024).toFixed(1) + ' MB';
        } else {
          sizeEl.textContent = '9.2 MB';
        }
      } catch(e) {
        sizeEl.textContent = '9.2 MB';
      }
    }

    function downloadAPK() {
      window.open(document.getElementById('downloadBtn').href, '_blank');
    }

    init();
  </script>
</body>
</html>
