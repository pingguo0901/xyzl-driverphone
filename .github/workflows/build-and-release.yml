name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :composeApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xyzl-driver-apk
          path: composeApp/build/outputs/apk/release/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: composeApp/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VER=$(sed -n 's/.*appVersionName = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -1)
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          CODE=$(( MAJOR*10000 + MINOR*100 + PATCH ))
          TODAY=$(date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cat > version.json <<EOF
          {
            "versionCode": ${CODE},
            "versionName": "${VER}",
            "apkUrl": "https://github.com/pingguo0901/xyzl-driverphone/releases/download/${TAG}/composeApp-release.apk",
            "changelog": "- 新版本 ${VER}",
            "buildDate": "${TODAY}"
          }
          EOF
          git add version.json
          git commit -m "chore: 同步 version.json 到 ${VER}" || echo "no change"
          git push origin main
